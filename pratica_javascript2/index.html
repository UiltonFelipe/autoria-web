<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <h1>Calculadora de IMC</h1>

    <label for="peso">Peso (kg):</label>
    <input type="number" id="peso" name="peso" placeholder="Ex: 70">

    <label for="altura">Altura (m):</label>
    <input type="number" id="altura" step="0.01" name="altura" placeholder="Ex: 1.75">

    <button id="btnCalcular">Calcular IMC</button>
    <div id="resultado" class="vazio">
        <p id="valor_imc">preencha os campos acima</p>
        <p id="classificacao_imc"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
